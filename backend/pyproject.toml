[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "godseye-backend"
version = "0.5.0.dev1"
description = "Python backend migration for God's Eye"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "fastapi==0.146.0",
    "pydantic==2.14.1",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "protobuf==7.36.2",
    "h11==0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "httpx2==2.14.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "grpcio-tools==1.84.0",
    "types-protobuf==7.35.1.20260906",
    "uv==0.13.1",
    "cryptography==50.0.2",
]

[project.scripts]
godseye = "godseye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["parity: compares the retained Go release through its public interfaces"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/godseye/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["godseye/v1", "filesystem_windows.py"]

[[tool.mypy.overrides]]
module = ["godseye.v1.*"]
ignore_errors = true
