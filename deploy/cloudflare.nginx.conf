# Only publish behind Cloudflare Access. The origin port remains on loopback.
map $http_origin $dashboard_origin {
    default "invalid";
    "" "";
    "https://godseye.polycognition.online" "http://127.0.0.1:8765";
}

map $http_origin $earth_origin {
    default "invalid";
    "" "";
    "https://earth.polycognition.online" "http://127.0.0.1:4173";
}

server {
    listen 8080 default_server;
    server_name _;
    location = /healthz { return 200 "ok\n"; }
    location / { return 403; }
}

server {
    listen 8080;
    server_name godseye.polycognition.online;
    client_max_body_size 16m;
    if ($dashboard_origin = "invalid") { return 403; }
    location / {
        proxy_pass http://dashboard:8765;
        proxy_set_header Host "127.0.0.1:8765";
        proxy_set_header Origin $dashboard_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8080;
    server_name earth.polycognition.online;
    if ($earth_origin = "invalid") { return 403; }
    location / {
        proxy_pass http://earth:4173;
        proxy_set_header Host "127.0.0.1:4173";
        proxy_set_header Origin $earth_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
